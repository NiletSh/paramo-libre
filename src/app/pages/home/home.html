<section class="landing" @arrive>
  <div class="copy">
    <p class="reveal kicker">Trueque de libros</p>
    <h1 class="reveal">Intercambia un libro por otro libro.</h1>
    <p class="reveal lead">Encuentra una lectura, propone el cambio y recógela en el estante.</p>
    <div class="reveal actions">
      <a class="btn-primary" routerLink="/catalogo">Ver catálogo</a>
      <a class="btn-primary" routerLink="/auth/login">Iniciar sesión</a>
      <a class="btn-primary" routerLink="/auth/registro">Registrarse</a>
      <button type="button" class="btn-primary" (click)="openShareModal()">
        <span class="material-icons">share</span>
        Compartir
      </button>
    </div>
    <p class="reveal path">Explora <span></span> Elige <span></span> Propón <span></span> Estante</p>
  </div>

  <div class="scene" @sceneIn>
    <span class="volume volume-a" aria-hidden="true"></span>
    <span class="volume volume-b" aria-hidden="true"></span>
    <span class="volume volume-c" aria-hidden="true"></span>
    <figure class="frame">
      <img src="assets/images/libroparamo.png" alt="Libro abierto con montañas y el nombre Páramo Libre" />
    </figure>
  </div>
</section>

<app-share-modal *ngIf="shareOpen" (close)="closeShareModal()"></app-share-modal>
