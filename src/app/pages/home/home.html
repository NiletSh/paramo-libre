<div class="landing">
  <section class="stage">
    <div class="copy">
      <p class="kicker">Biblioteca comunitaria</p>
      <h1>Dale otra vida <em>a tus libros.</em></h1>
      <p class="lead">Intercambia una lectura por otra y recógela en el estante.</p>
      <div class="actions">
        <a class="btn-primary" routerLink="/catalogo">Explorar catálogo</a>
        <button type="button" class="btn-share" (click)="openShareModal()">
          <span class="material-icons">share</span>
          Compartir
        </button>
      </div>
      <div class="account-links">
        <a routerLink="/auth/login">Iniciar sesión</a>
        <span aria-hidden="true"></span>
        <a routerLink="/auth/registro">Crear cuenta</a>
      </div>
    </div>

    <figure class="frame">
      <img src="assets/images/libroparamo.png" alt="Libro abierto con montañas y el nombre Páramo Libre" />
    </figure>
  </section>

  <ol class="steps">
    <li><span>01</span> Explora el catálogo</li>
    <li><span>02</span> Elige un libro</li>
    <li><span>03</span> Propón el trueque</li>
    <li><span>04</span> Recógelo en el estante</li>
  </ol>
</div>

<app-share-modal *ngIf="shareOpen" (close)="closeShareModal()"></app-share-modal>
