<section class="night" @rise>
  <div class="copy">
    <p class="line index">01 — El estante</p>
    <h1 class="line">
      Un libro
      <em>encuentra</em>
      otro libro.
    </h1>
    <p class="line note">Páramo Libre junta a quien suelta una historia con quien la está buscando.</p>
    <div class="line actions">
      <a class="enter" routerLink="/catalogo">Ver el catálogo</a>
      <button type="button" class="text-link" (click)="openShareModal()">Compartir</button>
      <a class="text-link" routerLink="/auth/registro">Crear cuenta</a>
      <a class="text-link" routerLink="/auth/login">Entrar</a>
    </div>
  </div>

  <div class="still" @plate>
    <div class="spines" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <figure>
      <img src="assets/images/libroparamo.png" alt="Libro abierto con montañas y el nombre Páramo Libre" />
      <figcaption>Trueque en el estante comunitario</figcaption>
    </figure>
  </div>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-track">
      <span>Novela</span><span>Ciencia</span><span>Arte</span><span>Historia</span><span>Poesía</span><span>Filosofía</span>
      <span>Novela</span><span>Ciencia</span><span>Arte</span><span>Historia</span><span>Poesía</span><span>Filosofía</span>
    </div>
  </div>
</section>

<app-share-modal *ngIf="shareOpen" (close)="closeShareModal()"></app-share-modal>
